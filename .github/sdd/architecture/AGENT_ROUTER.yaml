version: '1.0'
name: agent_router
description: Roteador de agentes para template agentic SDD. O bootstrap registra o agente expert do projeto destino.
intake_contract:
  language_default: pt-BR
  mode: execute_and_synthesize
  max_context_paths: 3
  max_agents_parallel: 3
  min_agents: 1
  steps:
  - id: read_user_intent
    summary_pt: Ler a pergunta ou o objetivo do usuário (ou pedir uma frase se estiver vazio).
  - id: classify_one_line
    summary_pt: Classificar em uma linha (Spark, pipeline SQL, Databricks, GCP, CrewAI, revisão, KB, outro).
  - id: select_agents
    summary_pt: Escolher de min_agents a max_agents_parallel ids em agents[] cujos domínios ajudam na pergunta (via intake_hints, router ou cruzamento claro de temas).
  - id: list_context_paths
    summary_pt: Unir context_paths das hints aplicáveis; no máximo max_context_paths paths únicos (sem blocos longos de KB).
  - id: execute_agents_parallel
    summary_pt: Executar cada agente selecionado (Task em paralelo quando disponível; senão leitura sequencial do .md do agente + KB indicada) e registrar achados por @id.
  - id: synthesize_response
    summary_pt: Concatenar achados, resolver conflitos com synthesis.rules_pt e entregar resposta completa ao usuário na mesma conversa.
  - id: optional_follow_up
    summary_pt: Só se restar trabalho estruturado (workflow com RUN_ID, PR, SDD); caso contrário omitir secção.
  synthesis:
    rules_pt:
    - A resposta consolidada deve responder diretamente à pergunta do usuário, não apenas listar agentes.
    - Em conflito entre achados, priorizar evidência (KB, contrato, código citado) sobre opinião genérica.
    - Se houver agente expert do projeto (domain/*-expert), dar peso maior a regras de negócio e operação locais.
    - Não inventar @id fora de agents[]; não citar agentes que não participaram da execução.
    - Manter idioma pt-BR salvo pedido explícito em outro idioma.
  parallel_execution:
    prefer_task_tool: true
    task_subagent_default: generalPurpose
    fallback_sequential: true
    note_pt: Dispare uma Task por agente no mesmo turno quando a ferramenta Task existir; aguarde todas antes da síntese.
conventions:
  mention_format: '@{id}'
  id_equals_basename: true
  note_pt: O campo id de cada agente coincide com o nome do ficheiro .md (sem extensão).
roster_groups:
  data_engineering_spark:
    title_pt: Engenharia de dados — Spark / Lakeflow
    title_en: Data engineering — Spark / Lakeflow
  databricks_lakehouse:
    title_pt: Databricks (lakehouse, SQL, ML, plataforma)
    title_en: Databricks lakehouse
  ai_ml:
    title_pt: IA / ML / orquestração de agentes
    title_en: AI / ML / agent orchestration
  code_quality:
    title_pt: Qualidade e código Python
    title_en: Code quality
  exploration:
    title_pt: Exploração, KB e arquitectura de agentes
    title_en: Exploration & KB
  domain_platform:
    title_pt: Domínio — pipelines, extração, OCI, deploy
    title_en: Domain — pipelines, extraction, OCI
  communication:
    title_pt: Comunicação, slides, planeamento
    title_en: Communication & slides
  dev_experience:
    title_pt: Dev loop e prompts
    title_en: Developer experience
  workflow_sdd:
    title_pt: Workflow SDD (brainstorm → ship)
    title_en: SDD workflow
  workflow_makeapp_review:
    title_pt: MakeApp Review por lanes
    title_en: MakeApp Review workflow
  workflow_data_pipeline_review:
    title_pt: Data Pipeline Review por lanes
    title_en: Data Pipeline Review workflow
  workflow_dev_loop:
    title_pt: Dev Loop — implementação L2 por fases
    title_en: Dev Loop L2 phased implementation
  platform_edge:
    title_pt: Infra HTTP / borda (nginx, TLS)
    title_en: Web edge
