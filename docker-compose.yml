services:
  # --- 1. INFRAESTRUTURA DE DADOS ---
  postgres-ubereats:
    image: postgres:15
    container_name: postgres-ubereats
    ports:
      - "5432:5432"
    env_file: ./gen/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Monta nossos scripts SQL para dentro da pasta de inicialização do Postgres
      # Ele vai rodar CADA .sql nessa pasta AUTOMATICAMENTE na 1ª vez que o volume for criado.
      - ./sql:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-ubereats:
    image: minio/minio:latest
    container_name: minio-ubereats
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    env_file: ./gen/.env
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # --- 2. SERVIÇO DE SETUP (Cria o bucket automaticamente) ---
  minio-setup:
    image: minio/mc
    container_name: minio-setup
    # Espera o MinIO ficar "saudável"
    depends_on:
      minio-ubereats:
        condition: service_healthy
    env_file: ./gen/.env
    # Comandos para criar o bucket "uber-eats"
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio-ubereats:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
      /usr/bin/mc mb local/uber-eats --ignore-existing;
      /usr/bin/mc policy set public local/uber-eats;
      "
  
  # --- 3. GERADOR DE DADOS (unificado: Postgres real + Oracle real + MinIO no
  #        mesmo processo, necessário para o lookup cruzado entre as conexões) ---
  gen-unified:
    image: shadowtraffic/shadowtraffic:latest
    container_name: gen-unified
    depends_on:
      postgres-ubereats:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      oracle-ubereats:
        condition: service_healthy
    volumes:
      - ./gen/unified/uber-eats.json:/home/config.json:ro
    env_file: ./gen/.env
    command: --config /home/config.json

  # --- 4. ORACLE (Onda 3, Etapa 2) — recebe Restaurante/Produto/Estoque,
  #        com ARCHIVELOG + supplemental logging habilitados para o Debezium ---
  oracle-ubereats:
    image: gvenzl/oracle-free:23.4-full
    container_name: oracle-ubereats
    ports:
      - "1521:1521"
    env_file: ./gen/.env
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - APP_USER=${ORACLE_APP_USERNAME}
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./sql/oracle:/container-entrypoint-startdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # --- 5. REDPANDA (broker Kafka-compativel, leve — sem Zookeeper) ---
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  # --- 6. KAFKA CONNECT + DEBEZIUM (CDC do Oracle -> topicos no Redpanda) ---
  kafka-connect:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect
    depends_on:
      - redpanda
      - oracle-ubereats
    environment:
      - BOOTSTRAP_SERVERS=redpanda:9092
      - GROUP_ID=uber-eats-connect
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_status
    ports:
      - "8083:8083"

  # --- 7. MONGODB (satelite estatico "Perfil de Restaurante") ---
  mongo-ubereats:
    image: mongo:7
    container_name: mongo-ubereats
    ports:
      - "27017:27017"
    env_file: ./gen/.env
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
  minio_data:
  oracle_data:
  mongo_data: