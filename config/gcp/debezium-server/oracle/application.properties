debezium.sink.type=pubsub
debezium.sink.pubsub.project.id=${GCP_PROJECT_ID}
debezium.sink.pubsub.ordering.enabled=true

# Conector Oracle (modelo fisico F4.3): dominio Pessoas, decimal como texto,
# NUMBER(1) como booleano. Topicos Pub/Sub: oracle-gcp.UBEREATS.<TABELA>.
debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.hostname=oracle-ubereats
debezium.source.database.port=1521
debezium.source.database.user=c##dbzuser
debezium.source.database.password=${ORACLE_DEBEZIUM_SERVER_PASSWORD}
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1
debezium.source.database.connection.adapter=logminer
debezium.source.log.mining.strategy=online_catalog
debezium.source.schema.include.list=UBEREATS
debezium.source.table.include.list=UBEREATS.CITIES,UBEREATS.CUSTOMERS,UBEREATS.DRIVERS
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=string
debezium.source.converters=boolean
debezium.source.boolean.type=io.debezium.connector.oracle.converters.NumberOneToBooleanConverter
debezium.source.boolean.selector=.*CUSTOMERS.EMAIL_VERIFIED,.*CUSTOMERS.PHONE_VERIFIED
debezium.source.topic.prefix=oracle-gcp
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets-oracle.dat
debezium.source.offset.flush.interval.ms=0
# O conector Oracle exige historico de schema; no Debezium Server ele fica em arquivo.
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history-oracle.dat
debezium.source.schema.history.internal.store.only.captured.tables.ddl=true

# cdc_source_system canonico: identifica a fonte, nao a ferramenta (modelo fisico F4.6)
debezium.transforms=addSourceSystem
debezium.transforms.addSourceSystem.type=org.apache.kafka.connect.transforms.InsertField$Value
debezium.transforms.addSourceSystem.static.field=cdc_source_system
debezium.transforms.addSourceSystem.static.value=oracle-ubereats
