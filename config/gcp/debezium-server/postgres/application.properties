debezium.sink.type=pubsub
debezium.sink.pubsub.project.id=${GCP_PROJECT_ID}
debezium.sink.pubsub.ordering.enabled=true

# Conector Postgres (modelo fisico F4.2): publicacao do schema ubereats criada no init,
# slot proprio desta trilha. Topicos Pub/Sub: postgres-gcp.ubereats.<tabela>.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres-ubereats
debezium.source.database.port=5432
debezium.source.database.user=${POSTGRES_DEBEZIUM_USER}
debezium.source.database.password=${POSTGRES_DEBEZIUM_PASSWORD}
debezium.source.database.dbname=ubereats
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=dbz_ubereats
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=dbz_ubereats_gcp
debezium.source.schema.include.list=ubereats
debezium.source.snapshot.mode=initial
debezium.source.decimal.handling.mode=string
debezium.source.heartbeat.interval.ms=60000
debezium.source.topic.prefix=postgres-gcp
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets-postgres.dat
debezium.source.offset.flush.interval.ms=0

# cdc_source_system canonico: identifica a fonte, nao a ferramenta (modelo fisico F4.6)
debezium.transforms=addSourceSystem
debezium.transforms.addSourceSystem.type=org.apache.kafka.connect.transforms.InsertField$Value
debezium.transforms.addSourceSystem.static.field=cdc_source_system
debezium.transforms.addSourceSystem.static.value=postgres-ubereats
