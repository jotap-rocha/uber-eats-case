debezium.sink.type=pubsub
debezium.sink.pubsub.project.id=${GCP_PROJECT_ID}
debezium.sink.pubsub.ordering.enabled=true

debezium.source.connector.class=io.debezium.connector.oracle.OracleConnector
debezium.source.database.hostname=oracle-ubereats
debezium.source.database.port=1521
debezium.source.database.user=c##dbzuser
debezium.source.database.password=${ORACLE_DEBEZIUM_SERVER_PASSWORD}
debezium.source.database.dbname=FREE
debezium.source.database.pdb.name=FREEPDB1
debezium.source.topic.prefix=oracle-gcp
debezium.source.database.server.name=oracle-gcp
debezium.source.database.connection.adapter=logminer
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets-oracle.dat
debezium.source.offset.flush.interval.ms=0

# cdc_source_system canonico (contrato de CDC, docs/data-contract-cdc-gcp-datastream.md)
debezium.transforms=addSourceSystem
debezium.transforms.addSourceSystem.type=org.apache.kafka.connect.transforms.InsertField$Value
debezium.transforms.addSourceSystem.static.field=cdc_source_system
debezium.transforms.addSourceSystem.static.value=oracle-debezium-server-gcp
