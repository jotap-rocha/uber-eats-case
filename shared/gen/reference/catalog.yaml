# Catálogo de referência do seed (F5.4 do modelo físico). Por tipo de cozinha (restaurants.cuisine_type),
# os pratos que o seed pode sortear para um restaurante, com a ficha técnica (RN-37):
#   - ready: o próprio produto é o item de estoque (kind ready, unit unit), ficha com 1 unidade.
#   - recipe: itens de estoque do restaurante em gramas (ingredient) ou porções (prepared).
# Preço em reais (texto, vira Decimal). section segue as seções do cardápio (F3.1).
# Os tipos de cozinha precisam ser os mesmos que o template do ShadowTraffic sorteia.

